spring.application.name=news-aggregator-api

# H2 Database
spring.datasource.url=jdbc:h2:mem:newsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# News API Configuration
news.api.key=YOUR_API_KEY_HERE
news.api.url=https://newsapi.org/v2

# Cache Configuration
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s
